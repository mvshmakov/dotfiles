name: Lint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: shfmt + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Lint scope is defined once in the Makefile (SHELL_SCRIPTS), so CI and
      # local `make lint` always agree. Submodules are excluded from that
      # scope, hence no submodule checkout is needed.
      - name: Install linters
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt
      - name: Print linter versions
        run: shfmt --version && shellcheck --version
      - name: Run lint checks
        run: make lint

  nix:
    name: nix fmt + statix + deadnix + eval
    # aarch64-darwin, the platform the darwinConfigurations are for
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # Same Nix distribution as the machines (Determinate Nix)
      - uses: DeterminateSystems/determinate-nix-action@v3
      # Formats, lints and evaluates every darwinConfiguration (dry-run
      # build) - same targets as `make nix-ci` locally. The full closure is
      # not built here: it is ~12 GiB and `darwin-rebuild check` needs root.
      - name: Run Nix checks
        run: make nix-ci
