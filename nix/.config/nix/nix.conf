# User-level Nix client settings (~/.config/nix/nix.conf).
#
# Determinate Nix owns /etc/nix/nix.conf (flakes and nix-command are enabled
# there); daemon-side settings (trusted-users, keep-outputs, keep-derivations,
# substituters) are declared in nix-darwin instead:
# nix-darwin/.config/nix-darwin/modules/darwin/nix.nix -> /etc/nix/nix.custom.conf
#
# Kept for non-Determinate hosts (e.g. a Linux box with plain Nix)
experimental-features = nix-command flakes
